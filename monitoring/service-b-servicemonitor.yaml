apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: service-b-monitor
  namespace: monitoring
  labels:
    app: service-b
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring-app
  selector:
    matchLabels:
      app: service-b
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s