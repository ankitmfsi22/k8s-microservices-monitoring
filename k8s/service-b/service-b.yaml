apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: monitoring-app
  labels:
    app: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: service-b
          image: service-b:1.2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: '3001'
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: '100m'
              memory: '96Mi'
            limits:
              cpu: '500m'
              memory: '192Mi'
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-b-svc
  namespace: monitoring-app
  labels:
    app: service-b
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - name: http
      port: 3001
      targetPort: 3001
