apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
  namespace: monitoring-app
  labels:
    app: service-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
    spec:
      containers:
        - name: service-c
          image: service-c:1.2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: '3002'
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'
            limits:
              cpu: '200m'
              memory: '128Mi'
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-c-svc
  namespace: monitoring-app
  labels:
    app: service-c
spec:
  type: ClusterIP
  selector:
    app: service-c
  ports:
    - name: http
      port: 3002
      targetPort: 3002
